<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustration of a 3D printer and tools in a fabrication lab">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#f6f6f6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#sky)"/>
  <!-- wall shelf and pegboard -->
  <rect x="40" y="70" width="230" height="150" fill="#ffffff" stroke="#d1d1d1" stroke-width="3"/>
  <g fill="#d1d1d1">
    <circle cx="70" cy="100" r="4"/><circle cx="110" cy="100" r="4"/><circle cx="150" cy="100" r="4"/><circle cx="190" cy="100" r="4"/><circle cx="230" cy="100" r="4"/>
    <circle cx="70" cy="140" r="4"/><circle cx="110" cy="140" r="4"/><circle cx="150" cy="140" r="4"/><circle cx="190" cy="140" r="4"/><circle cx="230" cy="140" r="4"/>
    <circle cx="70" cy="180" r="4"/><circle cx="110" cy="180" r="4"/><circle cx="150" cy="180" r="4"/><circle cx="190" cy="180" r="4"/><circle cx="230" cy="180" r="4"/>
  </g>
  <!-- tools on the board -->
  <g stroke="#3e3e3e" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M90 110 L90 200"/>
    <path d="M140 110 L160 200"/>
  </g>
  <rect x="80" y="104" width="20" height="30" rx="4" fill="#732f2f"/>
  <circle cx="210" cy="150" r="26" fill="none" stroke="#500000" stroke-width="8"/>
  <!-- bench -->
  <rect x="0" y="470" width="600" height="22" fill="#3e3e3e"/>
  <rect x="0" y="492" width="600" height="108" fill="#d1d1d1"/>
  <rect x="40" y="492" width="16" height="108" fill="#a7a7a7"/>
  <rect x="544" y="492" width="16" height="108" fill="#a7a7a7"/>

  <!-- 3D printer frame -->
  <rect x="300" y="110" width="250" height="360" fill="none" stroke="#202020" stroke-width="14"/>
  <rect x="300" y="430" width="250" height="40" fill="#202020"/>
  <rect x="318" y="438" width="80" height="24" rx="3" fill="#3c001c"/>
  <rect x="326" y="444" width="44" height="12" fill="#e9c46a"/>
  <!-- gantry and print head -->
  <rect x="307" y="210" width="236" height="12" fill="#707070"/>
  <rect x="400" y="190" width="56" height="56" rx="4" fill="#500000"/>
  <rect x="412" y="200" width="32" height="8" fill="#732f2f"/>
  <path d="M420 246 L436 246 L428 266 Z" fill="#3e3e3e"/>
  <!-- filament spool -->
  <path d="M500 110 C 520 70, 560 60, 575 40" fill="none" stroke="#732f2f" stroke-width="4"/>
  <circle cx="575" cy="40" r="26" fill="#500000"/><circle cx="575" cy="40" r="9" fill="#e9eef2"/>
  <!-- build plate and printed part (a gear) -->
  <rect x="340" y="400" width="176" height="14" fill="#707070"/>
  <g transform="translate(428 368)">
    <path fill="#732f2f" d="M-8 -34h16l3 9a26 26 0 0 1 8 4l9-3 8 14-7 6a26 26 0 0 1 0 9l7 6-8 14-9-3a26 26 0 0 1-8 4l-3 9h-16l-3-9a26 26 0 0 1-8-4l-9 3-8-14 7-6a26 26 0 0 1 0-9l-7-6 8-14 9 3a26 26 0 0 1 8-4z"/>
    <circle r="10" fill="#f6f6f6"/>
  </g>
  <!-- small circuit board on the bench, with a soldering iron -->
  <rect x="70" y="412" width="170" height="58" rx="4" fill="#2f5d3a"/>
  <g fill="none" stroke="#d9a441" stroke-width="3">
    <path d="M85 428H130V452H175"/><path d="M190 425V455"/><path d="M85 456H120"/>
  </g>
  <rect x="140" y="420" width="34" height="24" fill="#202020"/>
  <circle cx="205" cy="440" r="6" fill="#d9a441"/>
  <path d="M232 380 L290 330" stroke="#3e3e3e" stroke-width="10" stroke-linecap="round"/>
  <path d="M232 380 L214 400" stroke="#a7a7a7" stroke-width="4" stroke-linecap="round"/>
  <path d="M290 330 L300 322" stroke="#500000" stroke-width="12" stroke-linecap="round"/>
</svg>
