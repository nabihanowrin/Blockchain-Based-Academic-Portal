<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustration of a microchip on a circuit board">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#3a0d17"/>
      <stop offset="1" stop-color="#12060a"/>
    </radialGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.5" stop-color="#262626"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c46a"/>
      <stop offset="1" stop-color="#b07a1f"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#5a1a26" stroke-width="1" opacity=".55"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#grid)"/>

  <!-- copper traces -->
  <g fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 230 H120 V120 H40"/>
    <path d="M210 260 H90 V300 H20"/>
    <path d="M210 340 H130 V430 H60 V560"/>
    <path d="M210 370 H160 V520"/>
    <path d="M390 230 H470 V90 H580"/>
    <path d="M390 270 H520 V200 H590"/>
    <path d="M390 330 H500 V420 H580"/>
    <path d="M390 370 H440 V560"/>
    <path d="M240 210 V120 H300 V30"/>
    <path d="M280 210 V160 H360 V60 H420"/>
    <path d="M320 210 V140"/>
    <path d="M360 210 V180 H430 V130"/>
    <path d="M240 390 V470 H150"/>
    <path d="M280 390 V560"/>
    <path d="M320 390 V500 H380 V580"/>
    <path d="M360 390 V450 H470"/>
  </g>
  <!-- vias -->
  <g fill="#12060a" stroke="#e9c46a" stroke-width="5">
    <circle cx="40" cy="120" r="9"/><circle cx="20" cy="300" r="9"/><circle cx="60" cy="560" r="9"/>
    <circle cx="160" cy="520" r="9"/><circle cx="580" cy="90" r="9"/><circle cx="590" cy="200" r="9"/>
    <circle cx="580" cy="420" r="9"/><circle cx="440" cy="560" r="9"/><circle cx="300" cy="30" r="9"/>
    <circle cx="420" cy="60" r="9"/><circle cx="320" cy="140" r="9"/><circle cx="430" cy="130" r="9"/>
    <circle cx="150" cy="470" r="9"/><circle cx="280" cy="560" r="9"/><circle cx="380" cy="580" r="9"/>
    <circle cx="470" cy="450" r="9"/>
  </g>

  <!-- pins -->
  <g fill="#c9c9c9">
    <rect x="186" y="222" width="28" height="12" rx="2"/><rect x="186" y="252" width="28" height="12" rx="2"/>
    <rect x="186" y="282" width="28" height="12" rx="2"/><rect x="186" y="312" width="28" height="12" rx="2"/>
    <rect x="186" y="342" width="28" height="12" rx="2"/><rect x="186" y="364" width="28" height="12" rx="2"/>
    <rect x="386" y="222" width="28" height="12" rx="2"/><rect x="386" y="252" width="28" height="12" rx="2"/>
    <rect x="386" y="282" width="28" height="12" rx="2"/><rect x="386" y="312" width="28" height="12" rx="2"/>
    <rect x="386" y="342" width="28" height="12" rx="2"/><rect x="386" y="364" width="28" height="12" rx="2"/>
    <rect x="234" y="186" width="12" height="28" rx="2"/><rect x="264" y="186" width="12" height="28" rx="2"/>
    <rect x="294" y="186" width="12" height="28" rx="2"/><rect x="324" y="186" width="12" height="28" rx="2"/>
    <rect x="354" y="186" width="12" height="28" rx="2"/>
    <rect x="234" y="386" width="12" height="28" rx="2"/><rect x="264" y="386" width="12" height="28" rx="2"/>
    <rect x="294" y="386" width="12" height="28" rx="2"/><rect x="324" y="386" width="12" height="28" rx="2"/>
    <rect x="354" y="386" width="12" height="28" rx="2"/>
  </g>
  <!-- package and die -->
  <rect x="206" y="206" width="188" height="188" rx="10" fill="url(#die)" stroke="#5e5e5e" stroke-width="2"/>
  <circle cx="226" cy="226" r="6" fill="#5e5e5e"/>
  <rect x="246" y="246" width="108" height="108" rx="4" fill="url(#core)"/>
  <g stroke="#7a5313" stroke-width="2" opacity=".7">
    <path d="M246 273H354M246 300H354M246 327H354M273 246V354M300 246V354M327 246V354"/>
  </g>
  <rect x="260" y="260" width="80" height="80" fill="none" stroke="#fff3cf" stroke-width="2" opacity=".6"/>
  <text x="300" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#3c001c">EEE</text>
</svg>
